  * { cursor: var(--cursor-hand) !important; }
  *:active { cursor: var(--cursor-hand-press) !important; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--cream);
    color: var(--gray);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  /* 纯色背景（固定米白，canvas 未启动时的兜底色） */
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    isolation: isolate;
    background: var(--cream);
    --scene-unit: 200px;
  }

  /* 全屏特效画布（仿 Mikutap：特效铺满全屏、层层叠加） */
  #fx {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
  }

  /* 分区按钮闪光层：点击/滑过时分区短暂显示半透明白色再淡出 */
  #zoneflash {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }
  .zone-flash {
    position: absolute;
    background: transparent;
    border-radius: 2vmin;
    opacity: 0;
    animation: zoneFade .45s ease-out forwards;
  }
  @keyframes zoneFade {
    0%, 100% { opacity: 0; }
  }

  /* 点击文字：旧文字上浮淡出，最外层定位与内层抖动互不覆盖。 */
  #click-text-layer {
    position: absolute;
    inset: 0;
    z-index: 8;
    overflow: hidden;
    pointer-events: none;
  }
  .click-claude {
    position: absolute;
    transform: translate(-50%, -50%);
    animation: claudeTextFade .9s ease-out forwards;
  }
  .click-claude-float {
    display: block;
    animation: claudeTextRise .9s cubic-bezier(.16, .72, .28, 1) forwards;
  }
  .click-claude-copy {
    display: block;
    color: var(--coral);
    font: 900 clamp(22px, 4.2vmin, 42px)/1 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    letter-spacing: .03em;
    white-space: nowrap;
    text-shadow: 0 3px 0 var(--amber), 0 9px 20px rgba(135, 131, 126, .3);
    transform-origin: 50% 58%;
    will-change: transform;
  }
  @keyframes claudeTextFade {
    0%, 62% { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes claudeTextRise {
    from { transform: translateY(0); }
    to { transform: translateY(-72px); }
  }

  /* 摩卡 */
  #dog {
    position: absolute;
    inset: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    will-change: transform;
    transform-origin: 50% 62%;   /* 节拍压缩围绕狗身体中下部进行 */
  }
  #dog-inner {
    position: relative;
    width: var(--scene-unit);
    will-change: transform;   /* 叫弹簧跳由 JS 逐帧驱动（无 CSS transition，保证果断跟手） */
  }
  /* 长按果冻层：transform / 变红滤镜全部由 JS 逐帧驱动（Q弹 + 高频抖动） */
  #dog-jelly {
    position: relative;
    will-change: transform, filter;
  }
  #dog-inner img {
    width: 100%;
    display: block;
    filter: drop-shadow(0 18px 40px rgba(135, 131, 126, .4));
  }
  /* 张嘴图叠在闭嘴图之上：下层始终不透明，只切换上层透明度，
     避免交叉淡化时两张图都半透明导致整体变透明 */
  #dog-open {
    position: absolute;
    left: 0; top: 0;
    opacity: 0;
    transition: opacity .08s linear;
  }
  #dog-inner.bark-image #dog-open { opacity: 1; }

  /* 顶部控制：互动时隐藏，闲置 2 秒后由 JS 淡入 */
  #top-controls {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    right: max(14px, env(safe-area-inset-right));
    z-index: 80;                      /* 高于分享弹层(60)与底部广告(70)，确保声音按钮始终可点 */
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
    /* 投影放在容器上：按钮本体用了 clip-path 切角，box-shadow 会被一起裁掉，
       容器的 drop-shadow 才能贴合八边形轮廓 */
    filter: drop-shadow(0 6px 14px rgba(135, 131, 126, .22));
    transition: opacity .5s ease, transform .5s cubic-bezier(.2, .8, .2, 1);
  }
  #top-controls.is-visible {
    opacity: 1;
    transform: translateY(0);
  }
  #top-controls.is-revealing-fast {
    transition-duration: .2s;
  }
  .control-group {
    display: flex;
    gap: 8px;
  }
  /* 几何化切角按钮：八边形轮廓呼应全屏几何特效（hexagon / diamond 粒子）。
     按钮本体背景充当“描边色”，::before 用缩小一号的同款切角多边形铺底色，
     描边因此能严格贴合切角（普通 border 做不到），颜色用变量一键切换 */
  .control-button {
    --btn-edge: rgba(135, 131, 126, .72);   /* 描边色 */
    --btn-fill: rgba(255, 242, 220, .92);   /* 底色 */
    position: relative;
    min-width: 68px;
    min-height: 44px;
    padding: 8px 12px;
    border: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--gray);
    background: var(--btn-edge);
    clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px),
                       calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
    font: 700 13px/1 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    pointer-events: auto;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transform: scale(var(--rhythm-scale, 1));
    transition: color .2s ease, background .2s ease;
  }
  .control-button::before {
    content: "";
    position: absolute;
    inset: 2px;
    z-index: -1;
    background: var(--btn-fill);
    clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px),
                       calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
    transition: background .2s ease;
  }
  /* 律动缩放由 JS 使用 Web Audio 时钟逐帧写入，避免切换静音时相位重置 */
  .control-button:active { transform: scale(.94); }
  .control-button:focus-visible {
    outline: 3px solid rgba(62, 123, 250, .38);
    outline-offset: 2px;
  }
  /* 悬停描边变琥珀色（仅桌面端）；.is-muted 规则在更后面，静音态优先 */
  @media (hover: hover) {
    .control-button:hover { --btn-edge: rgba(255, 180, 0, .85); }
  }
  .control-button svg {
    width: 20px;
    height: 20px;
    overflow: visible;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .control-button .mute-slash {
    opacity: 0;
    stroke: var(--coral);
    stroke-width: 2.6;
    transition: opacity .2s ease;
  }
  .control-button.is-muted {
    --btn-edge: rgba(255, 90, 95, .68);
    --btn-fill: rgba(255, 255, 255, .94);
    color: var(--coral);
  }
  .control-button.is-muted .mute-slash { opacity: 1; }
  /* 圆形图标按钮：仅含图标的左上角按钮（音乐 / 音效） */
  .control-button.icon-button {
    min-width: 0;
    width: 44px;
    height: 44px;
    padding: 0;
    border-radius: 50%;
    clip-path: none;
  }
  .control-button.icon-button::before {
    border-radius: 50%;
    clip-path: none;
  }
  @media (max-width: 430px) {
    #top-controls {
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      right: max(10px, env(safe-area-inset-right));
    }
    .control-button {
      min-width: 44px;
      padding-inline: 10px;
    }
    .control-button span { display: none; }
  }

  /* 首次进入欢迎界面：仅一个 3D 斜视按钮 */
  #welcome-ad {
    position: absolute;
    inset: 0;
    z-index: 90;            /* 高于分享弹层(60)/广告(70)/声音按钮(80)，息屏恢复时完全盖住它们 */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 24px;
    background: rgba(255, 242, 220, .96);
    transition: opacity .45s ease, visibility .45s ease;
  }
  #welcome-ad.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  /* 3D 45° 斜视按钮：圆柱形按钮（顶面 + 侧面 + 底面），按下时顶盖下沉 */
  .start-3d {
    width: clamp(150px, 42vmin, 220px);
    aspect-ratio: 1;
    padding: 0;
    border: 0;
    background: transparent;
    filter: drop-shadow(0 10px 18px rgba(135, 131, 126, .18));
  }
  .start-3d:disabled { opacity: .92; }
  .start-3d-art { width: 100%; height: 100%; display: block; overflow: visible; }
  .start-3d-shadow { fill: rgba(79, 73, 66, .24); transition: opacity .12s ease; }
  .start-3d-base { fill: #b37400; }
  .start-3d-side { fill: #c98700; }
  .start-3d-cap-side { fill: #e89a1e; }
  .start-3d-cap-top { fill: #ffc54a; }
  .start-3d-cap-gloss { fill: #ffe08a; opacity: .85; }
  .start-3d-cap { transition: transform .1s cubic-bezier(.2, .8, .2, 1); }
  .start-3d:not(:disabled):active .start-3d-cap,
  .start-3d.is-pressed .start-3d-cap { transform: translateY(22px); }
  .start-3d:not(:disabled):active .start-3d-shadow,
  .start-3d.is-pressed .start-3d-shadow { opacity: .14; }
  .start-3d:focus-visible {
    outline: 3px solid rgba(62, 123, 250, .4);
    outline-offset: 6px;
    border-radius: 50%;
  }
  .welcome-status {
    color: var(--gray);
    font: 600 13px/1.4 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    letter-spacing: .12em;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .welcome-status.hide { visibility: hidden; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* 欢迎界面“点击开始”：沿用点击弹出字的排版（珊瑚红 + 琥珀描边阴影），
     保持一种静态的夸张变形（拉伸 + 倾斜 + 旋转），不做动画。 */
  .welcome-cta {
    color: var(--coral);
    font: 900 clamp(28px, 6.5vmin, 60px)/1 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    letter-spacing: .08em;
    white-space: nowrap;
    text-shadow: 0 4px 0 var(--amber), 0 12px 26px rgba(135, 131, 126, .32);
    transform-origin: 50% 70%;
    transform: scale(1.25, .82) skewX(-10deg) rotate(-3deg);
  }
  .welcome-cta.hide { visibility: hidden; }

  /* ============ 尾巴卷度 HUD（右上角实时累加，纯文字）============ */
  #energy-hud {
    position: absolute;
    top: max(16px, env(safe-area-inset-top));
    right: max(16px, env(safe-area-inset-right));
    z-index: 19;
    display: none;
    align-items: baseline;
    gap: 6px;
    color: var(--coral);
    font: 900 26px/1 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    letter-spacing: .02em;
    text-shadow: 0 2px 0 var(--amber), 0 5px 12px rgba(135, 131, 126, .35);
    pointer-events: none;
    transform-origin: 100% 50%;
    transform: scale(var(--energy-scale, 1));
    transition: transform .08s ease;
  }
  #energy-hud.is-on { display: inline-flex; }
  #energy-hud .energy-label {
    color: var(--gray);
    font: 700 12px/1 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    letter-spacing: .14em;
    text-shadow: 0 1px 2px rgba(255, 242, 220, .8);
  }
  /* 每次点击飘出的 +N */
  .energy-pop {
    position: absolute;
    right: 10px;
    top: 50%;
    color: var(--coral);
    font: 900 18px/1 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    text-shadow: 0 2px 0 var(--amber);
    pointer-events: none;
    animation: energyPopRise .8s ease-out forwards;
  }
  @keyframes energyPopRise {
    0%   { opacity: 0; transform: translateY(6px) scale(.6); }
    20%  { opacity: 1; transform: translateY(0) scale(1.1); }
    100% { opacity: 0; transform: translateY(-34px) scale(.9); }
  }

  /* ============ 闲置分享弹层 ============ */
  #share-overlay {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(79, 73, 66, .55);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  #share-overlay.is-open { display: flex; }
  /* 卡片本身随节拍放大缩小 + 左右摆动（transform 由 tick() 每帧写入） */
  #share-card {
    position: relative;
    width: min(72vmin, 420px);   /* 卡片为 9:16，宽度收敛一些给提示/按钮留纵向空间 */
    will-change: transform;
    transform-origin: 50% 58%;
    filter: drop-shadow(0 24px 50px rgba(0, 0, 0, .42));
  }
  #share-card .share-frame {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    background: var(--cream);
    line-height: 0;
  }
  #share-card img.share-art {
    display: block;
    width: 100%;
    height: auto;
    -webkit-touch-callout: default;   /* 允许 iOS 长按保存 */
    -webkit-user-select: auto;
    user-select: auto;
  }
  #share-card .share-hint {
    margin-top: 18px;
    text-align: center;
    color: #fff2dc;
    font: 600 14px/1.4 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    letter-spacing: .08em;
    text-shadow: 0 2px 8px rgba(0, 0, 0, .35);
  }
  .share-actions {
    margin-top: 14px;
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  .share-btn {
    padding: 12px 26px;
    border: none;
    color: #fff2dc;
    background: var(--amber);
    clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px),
                       calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px), 0 12px);
    font: 800 15px/1 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    letter-spacing: .06em;
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
  }
  .share-btn.secondary { background: rgba(255, 242, 220, .24); color: #fff2dc; }
  .share-btn:active { transform: scale(.95); }
  .share-close {
    position: absolute;
    top: -14px;
    right: -14px;
    z-index: 5;
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    color: #4f4942;
    background: #fff2dc;
    font: 800 22px/36px "PingFang SC", system-ui, sans-serif;
    cursor: pointer;
    pointer-events: auto;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
  }
  .share-close:active { transform: scale(.92); }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="fx"></canvas>
    <div id="zoneflash"></div>
    <div id="click-text-layer" aria-hidden="true"></div>

    <div id="dog">
      <div id="dog-inner">
        <div id="dog-jelly">
          <img id="dog-close" src="Image/moka_close_mouth.png" alt="摩卡" draggable="false" />
          <img id="dog-open" src="Image/moka_open_mouth.png" alt="" draggable="false" />
        </div>
      </div>
    </div>

    <div id="top-controls" class="is-visible" aria-label="声音与导航控制">
      <div id="audio-controls" class="control-group">
        <button id="music-toggle" class="control-button icon-button" type="button" aria-label="关闭音乐" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 18V5l10-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="16" cy="16" r="3" />
            <path class="mute-slash" d="M4 3l16 18" />
          </svg>
        </button>
        <button id="sfx-toggle" class="control-button icon-button" type="button" aria-label="关闭音效" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 9v6h4l5 4V5L9 9H5z" />
            <path d="M17 9.5a4 4 0 010 5" />
            <path class="mute-slash" d="M4 3l16 18" />
          </svg>
        </button>
      </div>
    </div>

    <div id="energy-hud" aria-live="polite">
      <span class="energy-label">尾巴卷度</span>
      <span id="energy-num">0</span>
    </div>

    <div id="share-overlay" role="dialog" aria-modal="true" aria-label="分享我的尾巴卷度">
      <div id="share-card">
        <button id="share-close" class="share-close" type="button" aria-label="关闭">×</button>
        <div class="share-frame">
          <img id="share-art" class="share-art" alt="我的摩卡尾巴卷度" draggable="false" />
        </div>
        <div id="share-hint" class="share-hint">长按图片即可保存到相册</div>
        <div class="share-actions" id="share-actions">
          <button id="share-download" class="share-btn" type="button">下载图片</button>
          <button id="share-dismiss" class="share-btn secondary" type="button">继续玩</button>
        </div>
      </div>
    </div>

    <div id="welcome-ad" role="dialog" aria-modal="true">
      <button id="welcome-enter" class="start-3d" type="button" aria-label="进入摩卡叫" disabled>
        <svg class="start-3d-art" viewBox="0 0 140 140" aria-hidden="true">
          <ellipse class="start-3d-shadow" cx="70" cy="112" rx="50" ry="12"/>
          <ellipse class="start-3d-base" cx="70" cy="86" rx="50" ry="22"/>
          <rect class="start-3d-side" x="20" y="62" width="100" height="24"/>
          <g class="start-3d-cap">
            <rect class="start-3d-cap-side" x="20" y="40" width="100" height="22"/>
            <ellipse class="start-3d-cap-top" cx="70" cy="40" rx="50" ry="22"/>
            <ellipse class="start-3d-cap-gloss" cx="60" cy="33" rx="28" ry="9"/>
          </g>
        </svg>
      </button>
      <div id="welcome-cta" class="welcome-cta hide">按下开始</div>
      <div id="welcome-status" class="welcome-status">资源加载中…</div>
    </div>
  </div>

  <script src="audio-data.js"></script>
  <script src="dog-data.js"></script>
  <script src="qr-data.js"></script>
  <script src="main.js?v=moka1"></script>
</body>
</html>
